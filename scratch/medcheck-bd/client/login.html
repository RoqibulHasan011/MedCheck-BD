<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MedCheck BD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Dynamic Navbar -->
  <div id="mainNavbar"></div>

  <main class="py-5">
    <div class="container">
      <div class="card-custom p-4 p-md-5 mx-auto" style="max-width: 520px;">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
            <i class="fas fa-shield-alt"></i>
          </div>
          <h3 class="fw-bold text-navy">Welcome to MedCheck BD</h3>
          <p class="text-muted small">Sign in to your Customer, Pharmacy, or Admin account</p>
        </div>

        <!-- Quick Fill Demo Bar -->
        <div class="p-3 bg-light rounded-3 border mb-4">
          <span class="small fw-bold text-muted d-block mb-2 text-center">
            <i class="fas fa-bolt text-warning me-1"></i> 1-Click Demo Accounts:
          </span>
          <div class="d-flex flex-wrap gap-2 justify-content-center">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="quickFillLogin('customer')">
              <i class="fas fa-user me-1"></i> Customer
            </button>
            <button type="button" class="btn btn-outline-success btn-sm" onclick="quickFillLogin('pharmacy')">
              <i class="fas fa-store me-1"></i> Pharmacy
            </button>
            <button type="button" class="btn btn-outline-danger btn-sm" onclick="quickFillLogin('admin')">
              <i class="fas fa-user-shield me-1"></i> Admin
            </button>
          </div>
        </div>

        <form onsubmit="handleLogin(event)">
          <div class="mb-3">
            <label class="form-label fw-bold text-navy small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" id="loginEmail" class="form-control" placeholder="e.g. customer@gmail.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold text-navy small">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary-custom w-100 py-2 mb-3">
            <i class="fas fa-sign-in-alt me-2"></i>Sign In
          </button>
        </form>

        <div class="text-center pt-3 border-top small text-muted">
          Don't have an account? <a href="register.html" class="fw-bold text-primary">Register as Customer</a><br>
          Are you a licensed pharmacy? <a href="pharmacy-register.html" class="fw-bold text-success">Register Pharmacy</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="mainFooter"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
