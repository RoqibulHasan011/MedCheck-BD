<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Medicine Receipt - MedCheck BD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-4">
    <!-- Top Action Bar (hidden when printing) -->
    <div class="d-flex justify-content-between align-items-center mb-3 no-print max-w-580 mx-auto" style="max-width: 580px;">
      <a href="javascript:window.history.back()" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Back
      </a>
      <button onclick="window.print()" class="btn btn-primary-custom btn-sm">
        <i class="fas fa-print me-1"></i> Print / Save as PDF
      </button>
    </div>

    <!-- Printable Receipt Wrapper -->
    <div class="receipt-wrapper" id="receiptContent">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Generating digital receipt...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const receiptId = urlParams.get('receiptId') || urlParams.get('id');
      const container = document.getElementById('receiptContent');

      if (!receiptId) {
        container.innerHTML = `
          <div class="alert alert-warning text-center">
            No receipt ID provided. Please supply a valid receipt ID.
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(`/api/sales/receipt/${encodeURIComponent(receiptId)}`);
        const data = await res.json();

        if (!data.success || !data.data) {
          throw new Error(data.message || 'Receipt not found');
        }

        const sale = data.data;
        const pharmacy = sale.pharmacyId || {};
        const items = sale.items || [];

        let itemsHtml = items.map(item => `
          <tr>
            <td>
              <strong class="text-dark">${item.medicineName}</strong>
              <div class="small text-muted font-monospace">Batch: ${item.batchNumber}</div>
            </td>
            <td class="text-center">${item.quantity}</td>
            <td class="text-end">${formatBDT(item.unitPrice)}</td>
            <td class="text-end fw-bold">${formatBDT(item.totalPrice)}</td>
          </tr>
        `).join('');

        container.innerHTML = `
          <div class="receipt-header">
            <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
              <div class="brand-icon" style="width: 32px; height: 32px; font-size: 1rem;">
                <i class="fas fa-shield-alt"></i>
              </div>
              <span class="fw-bold fs-4 text-navy">MedCheck BD</span>
            </div>
            <div class="text-uppercase fw-bold text-success small mb-2">Verified Pharmacy Digital Receipt</div>
            <h5 class="fw-bold text-dark mb-0">${pharmacy.name || 'Dispensing Pharmacy'}</h5>
            <div class="small text-muted">${pharmacy.address || 'Dhaka, Bangladesh'}</div>
            <div class="small text-muted">Phone: ${pharmacy.phone || 'N/A'} • License: ${pharmacy.licenseNumber || 'Verified'}</div>
          </div>

          <!-- Receipt Details Meta -->
          <div class="row g-2 small mb-3">
            <div class="col-6">
              <span class="text-muted">Receipt No:</span><br>
              <strong class="font-monospace">${sale.receiptId}</strong>
            </div>
            <div class="col-6 text-end">
              <span class="text-muted">Date & Time:</span><br>
              <strong>${new Date(sale.date).toLocaleString('en-GB')}</strong>
            </div>
            <div class="col-6 mt-2">
              <span class="text-muted">Customer:</span><br>
              <strong>${sale.customerName || 'Walk-in Customer'}</strong>
            </div>
            <div class="col-6 mt-2 text-end">
              <span class="text-muted">Payment Mode:</span><br>
              <span class="badge bg-light text-dark border">${sale.paymentMethod || 'Cash'}</span>
            </div>
          </div>

          <hr class="border-secondary opacity-25 my-3">

          <!-- Itemized Table -->
          <table class="table table-sm align-middle mb-3">
            <thead class="small text-muted">
              <tr>
                <th>Item & Batch</th>
                <th class="text-center">Qty</th>
                <th class="text-end">Price</th>
                <th class="text-end">Total</th>
              </tr>
            </thead>
            <tbody class="small">
              ${itemsHtml}
            </tbody>
          </table>

          <hr class="border-secondary opacity-25 my-3">

          <!-- Totals -->
          <div class="small">
            <div class="d-flex justify-content-between mb-1">
              <span class="text-muted">Subtotal:</span>
              <span class="fw-bold">${formatBDT(sale.subtotal)}</span>
            </div>
            ${sale.discount > 0 ? `
              <div class="d-flex justify-content-between mb-1 text-success">
                <span>Discount:</span>
                <span>-${formatBDT(sale.discount)}</span>
              </div>
            ` : ''}
            <div class="d-flex justify-content-between fs-5 fw-bold text-navy mt-2 pt-2 border-top">
              <span>Grand Total:</span>
              <span class="text-primary">${formatBDT(sale.totalPrice)}</span>
            </div>
          </div>

          <!-- Barcode simulation -->
          <div class="mt-4 pt-3 border-top text-center">
            <div class="receipt-barcode small mb-1">
              ||| ||||| |||| |||||||| ||||| |||| |||
            </div>
            <div class="font-monospace small text-muted">${sale.receiptId}</div>
          </div>

          <div class="text-center mt-3 pt-2 text-muted" style="font-size: 0.75rem;">
            Thank you for purchasing via a MedCheck BD Verified Pharmacy.<br>
            For safety verification and alerts, visit <strong>medcheckbd.com</strong>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
