<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration - MedCheck BD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Dynamic Navbar -->
  <div id="mainNavbar"></div>

  <main class="py-5">
    <div class="container">
      <div class="card-custom p-4 p-md-5 mx-auto" style="max-width: 560px;">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
            <i class="fas fa-user-plus"></i>
          </div>
          <h3 class="fw-bold text-navy">Create Customer Account</h3>
          <p class="text-muted small">Access personal medicine history, price alerts, and digital purchase receipts</p>
        </div>

        <form onsubmit="handleRegister(event)">
          <div class="mb-3">
            <label class="form-label fw-bold text-navy small">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
              <input type="text" id="regName" class="form-control" placeholder="e.g. Shakil Mahmud" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold text-navy small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" id="regEmail" class="form-control" placeholder="e.g. shakil@gmail.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold text-navy small">Phone Number (Bangladesh)</label>
            <div class="input-group">
              <span class="input-group-text bg-white">+880</span>
              <input type="tel" id="regPhone" class="form-control" placeholder="1711000000" required>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold text-navy small">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="6" required>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold text-navy small">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" id="regConfirmPassword" class="form-control" placeholder="••••••••" minlength="6" required>
              </div>
            </div>
          </div>

          <button type="submit" id="registerBtn" class="btn btn-primary-custom w-100 py-2 mb-3">
            <i class="fas fa-user-plus me-2"></i>Create Customer Account
          </button>
        </form>

        <div class="text-center pt-3 border-top small text-muted">
          Already registered? <a href="login.html" class="fw-bold text-primary">Login here</a><br>
          Are you a pharmacy owner? <a href="pharmacy-register.html" class="fw-bold text-success">Register your Pharmacy</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="mainFooter"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
