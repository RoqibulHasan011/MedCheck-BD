<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Verified Pharmacies - MedCheck BD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="mainNavbar"></div>

  <main class="py-5">
    <div class="container">
      <!-- Header -->
      <div class="text-center max-w-700 mx-auto mb-5">
        <span class="badge bg-info bg-opacity-10 text-info fw-bold text-uppercase px-3 py-2 rounded-pill mb-2">
          <i class="fas fa-certificate me-1"></i> Verified Pharmacy Network
        </span>
        <h1 class="fw-bold text-navy">Find a Verified Pharmacy</h1>
        <p class="text-muted">
          Search authorized pharmacies across Dhaka and major Bangladeshi divisions holding authenticated DGDA drug licenses and real-time inventory.
        </p>
      </div>

      <!-- Filters Card -->
      <div class="card-custom p-4 mb-5">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label fw-bold text-navy small">Select Area / Hub</label>
            <select id="filterArea" class="form-select" onchange="loadPharmacies()">
              <option value="All Areas">All Areas (Bangladesh)</option>
              <option value="Dhanmondi">Dhanmondi, Dhaka</option>
              <option value="Mirpur">Mirpur, Dhaka</option>
              <option value="Uttara">Uttara, Dhaka</option>
              <option value="Mohammadpur">Mohammadpur, Dhaka</option>
              <option value="Gulshan">Gulshan, Dhaka</option>
              <option value="Banani">Banani, Dhaka</option>
              <option value="Chittagong">Chittagong Division</option>
              <option value="Sylhet">Sylhet Division</option>
              <option value="Rajshahi">Rajshahi Division</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold text-navy small">Filter by Available Medicine</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-pills text-primary"></i></span>
              <input
                type="text"
                id="filterMedicine"
                class="form-control"
                placeholder="e.g. Napa, Seclo, Ace..."
              >
              <button class="btn btn-primary-custom px-3" type="button" onclick="loadPharmacies()" title="Filter by Medicine">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold text-navy small">Search Pharmacy Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-clinic-medical text-primary"></i></span>
              <input
                type="text"
                id="searchPharmacy"
                class="form-control"
                placeholder="e.g. MedCare, Lazz Pharma..."
              >
              <button class="btn btn-primary-custom px-3" type="button" onclick="loadPharmacies()" title="Search Pharmacy">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Quick BD Pharmacy Filters -->
        <div class="d-flex flex-wrap align-items-center gap-2 mt-3 pt-3 border-top small text-muted">
          <span class="fw-bold text-navy"><i class="fas fa-fire text-danger me-1"></i> Popular BD Chains:</span>
          <button type="button" class="btn btn-light btn-sm border text-dark py-0 px-2" onclick="quickFilterPharmacy('MedCare')">MedCare Pharmacy</button>
          <button type="button" class="btn btn-light btn-sm border text-dark py-0 px-2" onclick="quickFilterPharmacy('Lazz Pharma')">Lazz Pharma</button>
          <button type="button" class="btn btn-light btn-sm border text-dark py-0 px-2" onclick="quickFilterPharmacy('Tamanna')">Tamanna Mirpur</button>
          <button type="button" class="btn btn-light btn-sm border text-dark py-0 px-2" onclick="quickFilterPharmacy('Popular')">Popular Uttara</button>
          <button type="button" class="btn btn-link btn-sm text-danger p-0 ms-auto text-decoration-none" onclick="resetPharmacyFilters()">
            <i class="fas fa-undo-alt me-1"></i> Reset Filters
          </button>
        </div>
      </div>

      <!-- Pharmacy Cards Grid -->
      <div class="row" id="pharmacyList">
        <!-- Loaded dynamically via js/pharmacy.js -->
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="mainFooter"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pharmacy.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const med = urlParams.get('medicine');
      if (med) {
        const medInput = document.getElementById('filterMedicine');
        if (medInput) medInput.value = decodeURIComponent(med);
      }
      const phm = urlParams.get('pharmacy');
      if (phm) {
        const phmInput = document.getElementById('searchPharmacy');
        if (phmInput) phmInput.value = decodeURIComponent(phm);
      }

      // Attach autocompletes
      setupMedicineAutocomplete('filterMedicine', () => loadPharmacies());
      setupPharmacyAutocomplete('searchPharmacy', () => loadPharmacies());

      // Live debounced input typing
      let debounceTimer = null;
      const triggerDebouncedLoad = () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(loadPharmacies, 280);
      };

      const searchInput = document.getElementById('searchPharmacy');
      if (searchInput) {
        searchInput.addEventListener('input', triggerDebouncedLoad);
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            clearTimeout(debounceTimer);
            loadPharmacies();
          }
        });
      }

      const medInput = document.getElementById('filterMedicine');
      if (medInput) {
        medInput.addEventListener('input', triggerDebouncedLoad);
        medInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            clearTimeout(debounceTimer);
            loadPharmacies();
          }
        });
      }

      loadPharmacies();
    });
  </script>
</body>
</html>
